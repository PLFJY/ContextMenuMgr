name: Release

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration
        required: false
        default: Release
        type: choice
        options:
          - Release
          - Beta
          - Debug
      app_id:
        description: Installer/App GUID metadata value
        required: false
        default: 45156332-3408-47B7-B5D2-2567E5888F64
        type: string
      commit_sha:
        description: Optional commit from main history (7-40 hex characters); empty builds the selected main HEAD
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  resolve-metadata:
    runs-on: windows-latest
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      release_version: ${{ steps.version.outputs.release_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      release_name: ${{ steps.version.outputs.release_name }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}
      should_create_release: ${{ steps.version.outputs.should_create_release }}

    steps:
      - name: Checkout main for source selection
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve source commit
        id: source
        shell: pwsh
        env:
          REQUESTED_COMMIT: ${{ inputs.commit_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $requested = ([string] $env:REQUESTED_COMMIT).Trim()
          if ($requested -and $requested -notmatch '^[0-9a-fA-F]{7,40}$') {
            throw 'commit_sha must be a 7-40 character hexadecimal commit SHA.'
          }

          if ($requested) {
            $sourceSha = git rev-parse --verify "$requested^{commit}" 2>$null
            if ($LASTEXITCODE -ne 0 -or $sourceSha -notmatch '^[0-9a-fA-F]{40}$') {
              throw "Cannot resolve commit_sha '$requested' to a unique commit."
            }
            git merge-base --is-ancestor $sourceSha origin/main
            if ($LASTEXITCODE -ne 0) {
              throw "Selected commit '$sourceSha' is not reachable from main."
            }
          }
          else {
            $sourceSha = git rev-parse HEAD
            if ($LASTEXITCODE -ne 0) {
              throw 'Cannot resolve the checked-out main HEAD.'
            }
          }

          $sourceSha = ([string] $sourceSha).Trim().ToLowerInvariant()
          if ($sourceSha -notmatch '^[0-9a-f]{40}$') {
            throw "Invalid resolved source SHA '$sourceSha'."
          }
          "source_sha=$sourceSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Build source: $sourceSha"

      - name: Checkout selected source
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.source.outputs.source_sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Resolve release metadata
        id: version
        shell: pwsh
        run: .\Scripts\Resolve-Version.ps1 -Configuration "${{ inputs.configuration }}"

      - name: Beta version gate
        if: inputs.configuration == 'Beta' && steps.version.outputs.should_create_release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .\Scripts\Test-BetaVersionGate.ps1 `
            -BetaVersion '${{ steps.version.outputs.release_version }}' `
            -OwnerRepo '${{ github.repository }}'

      - name: Guard release destination before building
        if: steps.version.outputs.should_create_release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG
          $sha = $env:SOURCE_SHA
          if ($tag -notmatch '^[A-Za-z0-9._+-]+$' -or $sha -notmatch '^[0-9a-f]{40}$') {
            throw 'Invalid release tag or source commit SHA.'
          }

          # Treat an existing draft and an already published release identically:
          # neither may have its body or assets changed by another build.
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
          }
          for ($page = 1; $page -le 100; $page++) {
            $url = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/releases?per_page=100&page=$page"
            $releases = @(Invoke-RestMethod -Uri $url -Method Get -Headers $headers -ErrorAction Stop)
            $match = @($releases | Where-Object { $_.tag_name -ceq $tag })
            if ($match.Count -ne 0) {
              throw "Release '$tag' already exists (draft=$($match[0].draft)). Refusing to overwrite body or assets."
            }
            if ($releases.Count -lt 100) { break }
            if ($page -eq 100) { throw 'Release listing exceeded the scan limit.' }
          }

          # target_commitish is ignored for existing tags. Fail rather than
          # silently publishing a build under a tag pointing elsewhere.
          $tagNames = @(git tag --list -- $tag)
          if ($LASTEXITCODE -ne 0) { throw "Failed to query git tags for '$tag'." }
          if ($tagNames.Count -gt 0) {
            $tagSha = git rev-parse --verify "refs/tags/$tag^{commit}"
            if ($LASTEXITCODE -ne 0 -or ([string] $tagSha).Trim() -ne $sha) {
              throw "Tag '$tag' does not point to selected commit $sha."
            }
          }
          Write-Host "Release destination verified: $tag -> $sha"


      - name: Create release notes
        shell: pwsh
        run: .\Scripts\New-ReleaseNotes.ps1 -PreviousTag "${{ steps.version.outputs.previous_tag }}" -OutputPath build/release-body.md

      - name: Upload release body
        uses: actions/upload-artifact@v7
        with:
          name: release-body
          path: build/release-body.md
          if-no-files-found: error

  build:
    needs: resolve-metadata
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: installer
            platform: win-x64
            distribution: self-contained
          - kind: installer
            platform: win-x86
            distribution: self-contained
          - kind: installer
            platform: win-arm64
            distribution: self-contained
          - kind: installer
            platform: win-x64
            distribution: framework-dependent
          - kind: installer
            platform: win-x86
            distribution: framework-dependent
          - kind: installer
            platform: win-arm64
            distribution: framework-dependent
          - kind: portable
            platform: anycpu
            distribution: framework-dependent

    steps:
      - name: Checkout selected source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-metadata.outputs.source_sha }}
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build package target
        shell: pwsh
        run: |
          .\Scripts\Build-Target.ps1 `
            -Kind "${{ matrix.kind }}" `
            -Platform "${{ matrix.platform }}" `
            -DistributionMode "${{ matrix.distribution }}" `
            -Configuration "${{ inputs.configuration }}" `
            -AppId "${{ inputs.app_id }}" `
            -Version "${{ needs.resolve-metadata.outputs.release_version }}"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ContextMenuMgrPlus-${{ needs.resolve-metadata.outputs.release_tag }}-${{ matrix.platform }}-${{ matrix.distribution }}-${{ matrix.kind }}
          path: build/dist/*
          if-no-files-found: error

  create-release:
    needs:
      - resolve-metadata
      - build
    runs-on: windows-latest
    concurrency:
      group: release-${{ needs.resolve-metadata.outputs.release_tag }}
      cancel-in-progress: false

    steps:
      - name: Checkout selected source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-metadata.outputs.source_sha }}
          fetch-depth: 0

      - name: Guard release destination before upload
        if: needs.resolve-metadata.outputs.should_create_release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          RELEASE_TAG: ${{ needs.resolve-metadata.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.resolve-metadata.outputs.source_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG
          $sha = $env:SOURCE_SHA
          if ($tag -notmatch '^[A-Za-z0-9._+-]+$' -or $sha -notmatch '^[0-9a-f]{40}$') {
            throw 'Invalid release tag or source commit SHA.'
          }

          # Treat an existing draft and an already published release identically:
          # neither may have its body or assets changed by another build.
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
          }
          for ($page = 1; $page -le 100; $page++) {
            $url = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/releases?per_page=100&page=$page"
            $releases = @(Invoke-RestMethod -Uri $url -Method Get -Headers $headers -ErrorAction Stop)
            $match = @($releases | Where-Object { $_.tag_name -ceq $tag })
            if ($match.Count -ne 0) {
              throw "Release '$tag' already exists (draft=$($match[0].draft)). Refusing to overwrite body or assets."
            }
            if ($releases.Count -lt 100) { break }
            if ($page -eq 100) { throw 'Release listing exceeded the scan limit.' }
          }

          # target_commitish is ignored for existing tags. Fail rather than
          # silently publishing a build under a tag pointing elsewhere.
          $tagNames = @(git tag --list -- $tag)
          if ($LASTEXITCODE -ne 0) { throw "Failed to query git tags for '$tag'." }
          if ($tagNames.Count -gt 0) {
            $tagSha = git rev-parse --verify "refs/tags/$tag^{commit}"
            if ($LASTEXITCODE -ne 0 -or ([string] $tagSha).Trim() -ne $sha) {
              throw "Tag '$tag' does not point to selected commit $sha."
            }
          }
          Write-Host "Release destination verified: $tag -> $sha"


      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: downloaded-artifacts
          pattern: ContextMenuMgrPlus-*

      - name: Download release body
        uses: actions/download-artifact@v7
        with:
          name: release-body
          path: build

      - name: Flatten artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/dist | Out-Null
          Get-ChildItem -LiteralPath downloaded-artifacts -Recurse -File |
            Where-Object { $_.Extension -in '.exe', '.zip' } |
            ForEach-Object {
              Copy-Item -LiteralPath $_.FullName -Destination (Join-Path 'build/dist' $_.Name) -Force
            }

      - name: Append SHA256 table
        shell: pwsh
        run: .\Scripts\New-ChecksumTable.ps1 -ArtifactDirectory build/dist -ReleaseBodyPath build/release-body.md

      - name: Create draft release
        if: needs.resolve-metadata.outputs.should_create_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve-metadata.outputs.release_tag }}
          target_commitish: ${{ needs.resolve-metadata.outputs.source_sha }}
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          name: ${{ needs.resolve-metadata.outputs.release_name }}
          draft: true
          prerelease: ${{ needs.resolve-metadata.outputs.prerelease }}
          body_path: build/release-body.md
          files: build/dist/*
          overwrite_files: false
          fail_on_unmatched_files: true

      - name: Verify release tag commit
        if: needs.resolve-metadata.outputs.should_create_release == 'true'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.resolve-metadata.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.resolve-metadata.outputs.source_sha }}
        run: |
          git fetch origin "refs/tags/$env:RELEASE_TAG" --force
          if ($LASTEXITCODE -ne 0) {
            throw "Cannot retrieve release tag '$env:RELEASE_TAG' after draft creation."
          }
          $tagSha = git rev-parse --verify "refs/tags/$env:RELEASE_TAG^{commit}"
          if ($LASTEXITCODE -ne 0 -or ([string] $tagSha).Trim() -ne $env:SOURCE_SHA) {
            throw "Release tag '$env:RELEASE_TAG' does not point to built commit '$env:SOURCE_SHA'."
          }
          Write-Host "Verified release tag $env:RELEASE_TAG at $tagSha."
